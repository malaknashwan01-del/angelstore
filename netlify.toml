# نشر الواجهة على Netlify
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# طلبات /api بتروح للسيرفر على Render — نفس الدومين، فالـ cookies بتشتغل
[[redirects]]
  from = "/api/*"
  to = "https://angelstore-api.onrender.com/api/:splat"  status = 200
  force = true

# أي رابط ثاني بيفتح التطبيق (React Router بيتعامل معه)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
